<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Diseñar actividades</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--green:#006b4b;--dark:#00583f;--lime:#91c83e;--yellow:#ffcf32;--bg:#fbfbf5;--text:#124d3b;--muted:#718078;--border:#e4ebdf}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at top left,#e6f3e1,transparent 380px),var(--bg)}body::-webkit-scrollbar,.modal::-webkit-scrollbar{display:none}body,.modal{scrollbar-width:none}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.primary:active,.action:active,.secondary:active,.close:active{transform:scale(.97)}.page{position:relative;min-height:100vh;overflow:hidden;isolation:isolate}.arc{position:absolute;z-index:-1;width:300px;height:150px;top:-100px;right:-60px;border:18px solid #e4f0de;border-radius:50%}.container{width:min(1080px,calc(100% - 64px));margin:auto;padding:55px 0 150px}.header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:30px}h1{margin:0;color:var(--dark);font-size:clamp(2rem,4vw,3rem);font-weight:900;letter-spacing:-.045em;line-height:1.1}.subtitle{margin:12px 0 0;color:var(--muted);line-height:1.6}.primary{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border:0;border-radius:50px;background:var(--green);color:white;font-weight:800;box-shadow:0 8px 20px #006b4b20;transition:.2s;white-space:nowrap}.primary:hover{background:var(--dark);transform:translateY(-2px)}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 15px}.section-title-group{display:flex;align-items:center;gap:12px}.section-title-group h2{margin:0;font-size:1.15rem}.section-heading>span{color:var(--muted);font-size:.82rem}.count{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 9px;border-radius:50px;background:var(--yellow);color:var(--dark);font-size:.85rem;font-weight:900}.activity-list{display:grid;gap:14px}.activity{--activity-color:#087b55;display:grid;grid-template-columns:6px minmax(0,1fr) auto;align-items:center;gap:18px;padding:18px 20px 18px 0;border:1px solid var(--border);border-radius:22px;background:white;box-shadow:0 5px 20px #004c3308;transition:.2s}.activity:hover{transform:translateY(-2px);box-shadow:0 12px 30px #004c3312}.color-rail{width:6px;height:100%;min-height:65px;background:var(--activity-color);border-radius:0 8px 8px 0}.activity-info{display:flex;align-items:center;gap:15px;min-width:0}.activity-icon{display:grid;place-items:center;flex-shrink:0;width:58px;height:58px;border-radius:18px;background:color-mix(in srgb,var(--activity-color) 13%,white);color:var(--activity-color);font-size:1.4rem}.activity-details{min-width:0}.activity-details h3{margin:0;font-size:1rem;font-weight:850;overflow-wrap:anywhere}.activity-details p{margin:5px 0 0;color:var(--muted);font-size:.83rem}.status{display:inline-flex;align-items:center;gap:7px;margin-top:9px;font-size:.76rem;font-weight:800;color:var(--muted)}.status-dot{width:10px;height:10px;border-radius:50%;background:#b9c2bb}.status.active{color:#117a3d}.status.active .status-dot{background:#1fae5a;animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #1fae5a80}70%{box-shadow:0 0 0 8px #1fae5a00}100%{box-shadow:0 0 0 0 #1fae5a00}}@media(prefers-reduced-motion:reduce){.status.active .status-dot{animation:none}}.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.action{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:39px;padding:0 13px;border:1px solid var(--border);border-radius:50px;background:white;color:var(--green);font-size:.79rem;font-weight:800}.action:hover{background:#edf6e9}.action.share{background:#fff7d7;border-color:#f4e6a5;color:#665700}.action.delete{color:#b83a34}.action.delete:hover{background:#fff0ef}.action.toggle.activate{border-color:#bfe3cd;background:#eef8f1;color:#0d7a3e}.action.toggle.activate:hover{background:#e2f3e8}.empty{display:none;padding:40px 20px;text-align:center;border:1px dashed #c9ddc4;border-radius:22px;background:white}.empty i{color:var(--lime);font-size:2rem}.empty h3{margin-bottom:5px}.empty p{color:var(--muted)}.waves{position:absolute;z-index:-1;bottom:-35px;left:-5%;width:110%;height:130px;overflow:hidden;pointer-events:none}.wave{position:absolute;width:110%;height:150px;left:-5%;border-radius:50% 50% 0 0;transform:rotate(-3deg)}.wave-light{top:10px;background:#a6d8a0}.wave-dark{top:35px;background:#08724f}.overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#002d1f75;backdrop-filter:blur(5px)}.overlay.open{display:flex}.modal{width:min(100%,460px);max-height:90vh;overflow-y:auto;padding:25px;border-radius:25px;background:var(--bg);box-shadow:0 25px 70px #0003}.modal-header{display:flex;justify-content:space-between;gap:15px;margin-bottom:24px}.modal-header h2{margin:0;color:var(--dark)}.modal-header p{color:var(--muted);font-size:.88rem}.close{width:38px;height:38px;flex-shrink:0;border:0;border-radius:50%;background:#edf6e9;color:var(--green)}.field{margin-bottom:17px}.field label{display:block;margin-bottom:8px;font-size:.85rem;font-weight:800}.field input,.field select{width:100%;min-height:45px;padding:0 12px;border:1px solid #dbe5d7;border-radius:12px;background:white;color:var(--text)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.swatches{display:flex;flex-wrap:wrap;gap:14px}.swatch{position:relative;width:38px;height:38px;border-radius:50%;cursor:pointer}.swatch span{position:relative;display:block;width:100%;height:100%;border-radius:50%;background:var(--swatch);box-shadow:inset 0 0 0 1px #0003;transition:.15s}.swatch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}.swatch input:checked+span{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--swatch)}.swatch input:checked+span::after{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.85rem;text-shadow:0 1px 2px #00000050}.swatch input:focus-visible+span{outline:2px solid var(--dark);outline-offset:3px}.swatch:hover span{transform:scale(1.08)}.swatches.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatch.icons{display:flex;justify-content:center;width:auto;height:44px;border-radius:12px;border:1px solid var(--border);background:white}.swatch.icons span{display:grid;place-items:center;width:100%;height:100%;border-radius:11px;background:transparent;box-shadow:none}.swatch.icons span::after{content:none}.swatch.icons span i{font-size:1.1rem;color:var(--muted)}.swatch.icons input:checked+span{background:#eef6ea;box-shadow:inset 0 0 0 2px var(--green)}.swatch.icons input:checked+span i{color:var(--green)}.swatch.icons:hover span{transform:scale(1.04)}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.secondary{padding:0 18px;min-height:46px;border:1px solid var(--border);border-radius:50px;background:white;color:var(--green);font-weight:800}.toast{position:fixed;z-index:20;bottom:20px;left:50%;max-width:calc(100% - 30px);padding:13px 20px;border-radius:14px;background:var(--dark);color:white;font-size:.88rem;font-weight:700;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:840px){.action{min-width:44px;min-height:44px;padding:0;gap:0;font-size:0;border-radius:12px}.action i{font-size:1rem}}
@media(max-width:700px){.container{width:100%;padding:calc(24px + env(safe-area-inset-top)) 20px calc(90px + env(safe-area-inset-bottom))}.header{flex-direction:row;align-items:center;gap:14px;margin-bottom:22px}h1{flex:1;font-size:1.85rem}.subtitle{display:none}.header .primary{width:52px;height:52px;min-height:0;padding:0;gap:0;font-size:0;flex-shrink:0;border-radius:50%}.header .primary i{font-size:1.3rem}.section-heading{margin-bottom:12px}.section-heading>span{display:none}.section-title-group h2{font-size:1.05rem}.count{min-width:28px;height:28px}.activity{grid-template-columns:5px minmax(0,1fr);gap:0;padding:0;border-radius:16px;overflow:hidden}.color-rail{grid-row:1/span 2;width:5px;min-height:0}.activity-info{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:12px;row-gap:2px;padding:11px 13px 9px}.activity-icon{grid-column:1;grid-row:1/span 2;align-self:center;width:40px;height:40px;border-radius:12px;font-size:1.05rem}.activity-details{display:contents}.activity-details h3{grid-column:2;grid-row:1;min-width:0;font-size:.95rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{grid-column:3;grid-row:1;justify-self:end;margin-top:0;font-size:.7rem;white-space:nowrap}.activity-details p{grid-column:2/span 2;grid-row:2;display:block;margin:0;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{grid-column:2;display:grid;grid-template-columns:repeat(4,1fr);gap:0;width:auto;margin:0 10% 11px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#f7faf4}.action{width:100%;min-width:0;min-height:28px;padding:0;gap:0;font-size:0;border:0;border-radius:0;background:transparent;color:var(--green);transform:none}.action+.action{border-left:1px solid var(--border)}.action i{font-size:1rem}.action:hover{background:#eef6e9}.action:active{transform:none;background:#e3f0dd}.action.share{color:#a98200;background:transparent}.action.share:hover{background:#fff7d7}.action.toggle.activate{color:#0d7a3e;background:transparent}.action.toggle.activate:hover{background:#e9f6ed}.action.delete{color:#c0392b}.action.delete:hover{background:#fff0ef}.waves{height:100px}.wave{height:120px}.overlay{align-items:flex-end;padding:0;animation:fadeIn .2s ease}.overlay.open .modal{animation:sheetUp .34s cubic-bezier(.22,1,.36,1)}.modal{display:flex;flex-direction:column;width:100%;max-width:100%;max-height:92vh;padding:0;border-radius:24px 24px 0 0;overflow:hidden;background:var(--bg)}.modal-header{position:relative;flex:0 0 auto;margin:0;padding:24px 20px 14px;background:var(--bg);border-bottom:1px solid var(--border)}.modal-header::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:99px;background:#d5e2cf}.modal-header p{font-size:.85rem}.close{width:40px;height:40px;font-size:1.05rem}#form{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 20px 0}.modal-actions{position:sticky;bottom:0;flex:0 0 auto;gap:10px;margin:0;padding:14px 0 calc(16px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -12px 22px -14px #004c3326}.modal-actions .primary,.modal-actions .secondary{flex:1;min-height:50px}@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.toast{bottom:calc(18px + env(safe-area-inset-bottom));width:calc(100% - 32px);text-align:center}}
@media(max-width:480px){.activity-details h3{font-size:.9rem}.status{font-size:.68rem}.form-row{grid-template-columns:1fr;gap:0}}
@media(max-width:360px){.container{padding-right:14px;padding-left:14px}h1{font-size:1.8rem}.activity-info{gap:10px;padding:10px 11px 8px}.actions{margin-bottom:10px}.action i{font-size:.9rem}.modal-header{padding:22px 16px 12px}#form{padding:16px 16px 0}.modal-actions{padding:12px 0 calc(14px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){.overlay{animation:none}.overlay.open .modal{animation:none}}
</style>
</head>
<body>
<div class="page"><div class="arc" aria-hidden="true"></div>
<main class="container">
  <header class="header">
    <div>
      <h1>Diseñar actividades</h1>
      <p class="subtitle">Administra, personaliza y comparte tus actividades de aprendizaje.</p>
    </div>
    <button class="primary" id="addBtn" type="button"><i class="fa-solid fa-plus"></i> Nueva actividad</button>
  </header>

  <div class="section-heading">
    <div class="section-title-group">
      <h2>Actividades creadas</h2>
      <span class="count" id="count" aria-live="polite">4</span>
    </div>
    <span>Administra tus actividades</span>
  </div>

  <section class="activity-list" id="list" aria-label="Actividades creadas"></section>
  <section class="empty" id="empty"><i class="fa-solid fa-folder-open"></i><h3>Aún no tienes actividades</h3><p>Crea tu primera actividad para verla aquí.</p></section>
</main>
<div class="waves" aria-hidden="true"><div class="wave wave-light"></div><div class="wave wave-dark"></div></div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <section class="modal">
    <div class="modal-header"><div><h2 id="modalTitle">Nueva actividad</h2><p>Personaliza la apariencia de tu actividad.</p></div><button class="close" id="closeBtn" type="button" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button></div>
    <form id="form">
      <div class="field"><label for="title">Título de la actividad</label><input id="title" maxlength="80" placeholder="Ej. Exploradores de palabras" required></div>
      <div class="form-row">
        <div class="field"><label id="colorLabel">Color</label><div class="swatches" role="radiogroup" aria-labelledby="colorLabel"><label class="swatch" style="--swatch:#087b55"><input type="radio" name="color" value="#087b55" checked><span></span></label><label class="swatch" style="--swatch:#91c83e"><input type="radio" name="color" value="#91c83e"><span></span></label><label class="swatch" style="--swatch:#8bc9a2"><input type="radio" name="color" value="#8bc9a2"><span></span></label><label class="swatch" style="--swatch:#f4c928"><input type="radio" name="color" value="#f4c928"><span></span></label><label class="swatch" style="--swatch:#e06a3a"><input type="radio" name="color" value="#e06a3a"><span></span></label><label class="swatch" style="--swatch:#1e6fbf"><input type="radio" name="color" value="#1e6fbf"><span></span></label><label class="swatch" style="--swatch:#7a4fb5"><input type="radio" name="color" value="#7a4fb5"><span></span></label><label class="swatch" style="--swatch:#e2526e"><input type="radio" name="color" value="#e2526e"><span></span></label></div></div>
        <div class="field"><label id="iconLabel">Icono</label><div class="swatches icons" role="radiogroup" aria-labelledby="iconLabel"><label class="swatch icons"><input type="radio" name="icon" value="fa-book-open" checked aria-label="Libro"><span><i class="fa-solid fa-book-open"></i></span></label><label class="swatch icons"><input type="radio" name="icon" value="fa-spell-check" aria-label="Palabras"><span><i class="fa-solid fa-spell-check"></i></span></label><label class="swatch icons"><input type="radio" name="icon" value="fa-calculator" aria-label="Matemáticas"><span><i class="fa-solid fa-calculator"></i></span></label><label class="swatch icons"><input type="radio" name="icon" value="fa-palette" aria-label="Creatividad"><span><i class="fa-solid fa-palette"></i></span></label><label class="swatch icons"><input type="radio" name="icon" value="fa-lightbulb" aria-label="Ideas"><span><i class="fa-solid fa-lightbulb"></i></span></label><label class="swatch icons"><input type="radio" name="icon" value="fa-flask" aria-label="Ciencias"><span><i class="fa-solid fa-flask"></i></span></label><label class="swatch icons"><input type="radio" name="icon" value="fa-puzzle-piece" aria-label="Rompecabezas"><span><i class="fa-solid fa-puzzle-piece"></i></span></label><label class="swatch icons"><input type="radio" name="icon" value="fa-brain" aria-label="Pensamiento"><span><i class="fa-solid fa-brain"></i></span></label></div></div>
      </div>
      <div class="field"><label for="description">Descripción breve (opcional)</label><input id="description" maxlength="100" placeholder="Ej. Juegos para ampliar vocabulario"></div>
      <div class="modal-actions"><button type="button" class="secondary" id="cancelBtn">Cancelar</button><button type="submit" class="primary"><i class="fa-solid fa-check"></i> Guardar</button></div>
    </form>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const activities = [
 {id:1,title:"Exploradores de palabras",description:"Juegos para ampliar vocabulario",color:"#087b55",icon:"fa-spell-check",active:true,link:"https://avna.example/actividades/exploradores-de-palabras"},
 {id:2,title:"Reto matemático",description:"Desafíos para pensar y resolver",color:"#f4c928",icon:"fa-calculator",active:true,link:"https://avna.example/actividades/reto-matematico"},
 {id:3,title:"Laboratorio creativo",description:"Experimenta y crea algo nuevo",color:"#91c83e",icon:"fa-palette",active:true,link:"https://avna.example/actividades/laboratorio-creativo"},
 {id:4,title:"Comprensión lectora",description:"Lee, interpreta y descubre",color:"#8bc9a2",icon:"fa-book-open",active:true,link:"https://avna.example/actividades/comprension-lectora"}
];
let nextId=5,editingId=null,toastTimer;
const $=id=>document.getElementById(id);
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function setColor(value){const c=document.querySelector('input[name="color"][value="'+value+'"]');if(c)c.checked=true;}function getColor(){const c=document.querySelector('input[name="color"]:checked');return c?c.value:'#087b55';}function setIcon(value){const c=document.querySelector('input[name="icon"][value="'+value+'"]');if(c)c.checked=true;}function getIcon(){const c=document.querySelector('input[name="icon"]:checked');return c?c.value:'fa-book-open';}
function renderActivities(){
 $('count').textContent=activities.length;
 $('empty').style.display=activities.length?'none':'block';
 $('list').innerHTML=activities.map(a=>`<article class="activity" style="--activity-color:${escapeHTML(a.color)}"><div class="color-rail"></div><div class="activity-info"><div class="activity-icon"><i class="fa-solid ${escapeHTML(a.icon)}"></i></div><div class="activity-details"><h3>${escapeHTML(a.title)}</h3><p>${escapeHTML(a.description||'Actividad de aprendizaje')}</p><span class="status ${a.active?'active':'inactive'}"><span class="status-dot"></span>${a.active?'Activo':'Inactivo'}</span></div></div><div class="actions"><button class="action" data-action="edit" data-id="${a.id}" aria-label="Editar ${escapeHTML(a.title)}"><i class="fa-solid fa-pen"></i> Editar</button><button class="action share" data-action="share" data-id="${a.id}" aria-label="Compartir ${escapeHTML(a.title)}"><i class="fa-solid fa-link"></i> Compartir</button><button class="action toggle${a.active?'':' activate'}" data-action="toggle" data-id="${a.id}" aria-label="${a.active?'Desactivar':'Activar'} ${escapeHTML(a.title)}"><i class="fa-solid ${a.active?'fa-circle-pause':'fa-circle-play'}"></i> ${a.active?'Desactivar':'Activar'}</button><button class="action delete" data-action="delete" data-id="${a.id}" aria-label="Eliminar ${escapeHTML(a.title)}"><i class="fa-solid fa-trash-can"></i> Eliminar</button></div></article>`).join('');
}
function notify(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600);}
function openModal(a=null){editingId=a?a.id:null;$('form').reset();$('modalTitle').textContent=a?'Editar actividad':'Nueva actividad';if(a){$('title').value=a.title;$('description').value=a.description||'';setColor(a.color);setIcon(a.icon);}else{setColor('#087b55');setIcon('fa-book-open');}$('overlay').classList.add('open');document.body.style.overflow='hidden';$('title').focus();}
function closeModal(){$('overlay').classList.remove('open');document.body.style.overflow='';editingId=null;}
$('addBtn').addEventListener('click',()=>openModal());$('closeBtn').addEventListener('click',closeModal);$('cancelBtn').addEventListener('click',closeModal);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('form').addEventListener('submit',e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;const data={title,description:$('description').value.trim(),color:getColor(),icon:getIcon()};if(editingId!==null){const a=activities.find(x=>x.id===editingId);if(a)Object.assign(a,data);notify('Actividad actualizada correctamente.');}else{const slug=title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');activities.unshift({id:nextId++,active:true,...data,link:`https://avna.example/actividades/${slug||'nueva-actividad'}`});notify('Nueva actividad creada.');}renderActivities();closeModal();});
$('list').addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=activities.find(x=>x.id===Number(btn.dataset.id));if(!a)return;if(btn.dataset.action==='edit')openModal(a);if(btn.dataset.action==='toggle'){a.active=!a.active;renderActivities();notify(a.active?'Actividad activada.':'Actividad desactivada.');}if(btn.dataset.action==='delete'&&confirm(`¿Eliminar "${a.title}"? Esta acción no se puede deshacer.`)){activities.splice(activities.indexOf(a),1);renderActivities();notify('Actividad eliminada.');}if(btn.dataset.action==='share'){try{if(navigator.share){await navigator.share({title:a.title,text:`Mira esta actividad: ${a.title}`,url:a.link});}else if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(a.link);notify('Enlace copiado al portapapeles.');}else{window.prompt('Copia el enlace de la actividad:',a.link);}}catch(err){if(err.name!=='AbortError')window.prompt('Copia el enlace de la actividad:',a.link);}}});
renderActivities();
</script>
</body>
</html>
