<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AVNA · Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9f8f3; --green:#0f5a36; --green-d:#0b4a2c; --ink:#14301f; --muted:#4a5a50;
  --card:#fbfaf6; --line:#e3e4dc; --lime:#9bc53d; --yellow:#f6c93a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#f9f8f3}}
:root[data-theme="dark"]{--bg:#f9f8f3}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden}
.swoosh{position:absolute;pointer-events:none}
.s1{top:-30px;right:-40px;width:260px}
.s2{bottom:-30px;right:-20px;width:220px}
.logo{position:absolute;top:44px;left:64px;display:flex;align-items:center;gap:8px}
.logo .name{font-family:Georgia,'Times New Roman',serif;font-weight:700;color:var(--green);font-size:19px;line-height:1.05;letter-spacing:.12em}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:90px;padding:130px 60px 60px;flex-wrap:wrap}
.brand{width:300px;text-align:center;position:relative;z-index:1}
.brand h1{font-size:92px;font-weight:800;color:var(--green);letter-spacing:-2px;line-height:1}
.smile{display:block;margin:-8px auto 0;width:78px}
.brand .sub{font-size:15px;color:var(--muted);margin-top:2px}
.brand .tag{margin-top:34px;font-size:18px;line-height:1.5;color:var(--ink)}
.mascot{position:absolute;left:0;bottom:0;width:300px;z-index:1}
.card{width:440px;max-width:100%;background:var(--card);border-radius:24px;padding:38px 38px 30px;box-shadow:0 10px 40px rgba(20,48,31,.08);position:relative;z-index:2}
.card h2{font-size:24px;font-weight:600;color:var(--ink)}
.card .lead{font-size:14px;color:var(--ink);margin:4px 0 26px}
.field{display:flex;align-items:center;gap:14px;height:58px;border:1px solid var(--line);border-radius:12px;padding:0 18px;margin-bottom:16px;background:#fdfdfb}
.field svg{flex:none}
.field input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);min-width:0}
.field input::placeholder{color:#7b857f}
.field:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,90,54,.12)}
.eye{background:none;border:0;cursor:pointer;display:flex;padding:0}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px;font-size:13px}
.row label{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.row input{appearance:none;width:20px;height:20px;border:1.5px solid #6b756f;border-radius:4px;background:#fff;cursor:pointer;display:grid;place-content:center}
.row input:checked{background:var(--green);border-color:var(--green)}
.row input:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.row a{color:var(--green);text-decoration:none;font-size:12px;font-weight:500}
.btn{width:100%;height:56px;border:0;border-radius:12px;background:var(--green);color:#fff;font:600 16px 'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.btn:hover{background:var(--green-d)}
.btn svg{position:absolute;right:22px}
.or{display:flex;align-items:center;gap:14px;margin:22px 0;font-size:12px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.google{width:100%;height:54px;border:1px solid var(--line);border-radius:12px;background:#fdfdfb;font:600 16px 'Poppins',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.google:hover{background:#f3f3ee}
.foot{text-align:center;font-size:13px;margin-top:26px;color:var(--ink)}
.foot a{color:var(--green);font-weight:600;text-decoration:none;margin-left:6px}
@media (max-width:900px){
  .logo{left:24px;top:24px}
  .wrap{gap:30px;padding:110px 20px 40px}
  .mascot{display:none}
  .brand h1{font-size:72px}
}
</style>
</head>
<body>

<svg class="swoosh s1" viewBox="0 0 260 120" fill="none"><path d="M10 95C60 110 120 70 170 40 205 20 235 10 270 0" stroke="#0f5a36" stroke-width="24" stroke-linecap="round"/><circle cx="10" cy="92" r="12" fill="#6aa832"/></svg>
<svg class="swoosh s2" viewBox="0 0 220 90" fill="none"><path d="M30 100C80 85 130 50 180 20 200 8 215 2 240 -4" stroke="#0f5a36" stroke-width="22" stroke-linecap="round"/></svg>

<div class="logo" aria-label="Universidad Simón Bolívar">
  <svg width="68" height="56" viewBox="0 0 68 56" fill="none"><g fill="#0f5a36"><rect x="18" y="4" width="8" height="38" rx="2"/><rect x="40" y="4" width="8" height="38" rx="2"/><path d="M18 42c0 12 30 12 30 0v-6H40v6c0 3-14 3-14 0z"/><text x="2" y="38" font-family="Georgia,serif" font-weight="700" font-size="22">U</text><text x="30" y="46" font-family="Georgia,serif" font-weight="700" font-size="22">B</text></g></svg>
  <div class="name">UNIVERSIDAD<br>SIMÓN BOLÍVAR</div>
</div>

<main class="wrap">
  <section class="brand">
    <h1>AVNA</h1>
    <svg class="smile" viewBox="0 0 78 40" fill="none"><circle cx="39" cy="4" r="5.5" fill="#9bc53d" transform="translate(0,-8)"/><path d="M5 6c8 28 60 28 68 0" stroke="#9bc53d" stroke-width="7" stroke-linecap="round"/></svg>
    <p class="sub">Plataforma de Aprendizaje</p>
    <p class="tag">Conocimiento que te<br>acompaña en cada paso.</p>
  </section>

  <section class="card">
    <h2>Iniciar sesión</h2>
    <p class="lead">Accede a tu espacio de aprendizaje</p>
    <form onsubmit="return false">
      <div class="field">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14301f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>
        <input type="text" placeholder="Usuario" aria-label="Usuario" autocomplete="username">
      </div>
      <div class="field">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14301f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/><circle cx="12" cy="15.5" r="1" fill="#14301f"/></svg>
        <input id="pw" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password">
        <button type="button" class="eye" aria-label="Mostrar contraseña" onclick="var p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b756f" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="row">
        <label><input type="checkbox"> Recordar usuario</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <button class="btn" type="submit">Ingresar
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="or">o ingresa con</div>
    <button class="google" type="button">
      <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.200 5.300-4.700 6.900l7.300 5.700c4.300-4 6.800-9.900 6.800-17.100z"/><path fill="#FBBC05" d="M10.500 28.700A14.500 14.500 0 019.500 24c0-1.600.3-3.200.8-4.700l-7.900-6.100A24 24 0 000 24c0 3.900.9 7.500 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.300-5.700c-2 1.400-4.700 2.300-8.600 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>
      Google
    </button>
    <p class="foot">¿No tienes una cuenta?<a href="#">Contáctanos</a></p>
  </section>
</main>

<svg class="mascot" viewBox="0 0 300 330" fill="none" aria-hidden="true">
  <ellipse cx="120" cy="215" rx="95" ry="90" fill="#f6c93a"/>
  <path d="M30 150c-5-60 40-95 100-95 55 0 100 30 98 75-30-20-110-25-198 20z" fill="#12713f"/>
  <path d="M30 150c40-30 120-35 198-20 10 10 15 15 22 22-80-30-150-15-215 5z" fill="#0f5a36"/>
  <text x="95" y="120" font-family="Georgia,serif" font-weight="700" font-size="30" fill="#c9d98a">USB</text>
  <path d="M60 205q18-22 36 0" stroke="#3a2a1a" stroke-width="7" stroke-linecap="round"/>
  <path d="M140 195q18-22 36 0" stroke="#3a2a1a" stroke-width="7" stroke-linecap="round"/>
  <path d="M80 235q30 28 60 0" stroke="#3a2a1a" stroke-width="8" stroke-linecap="round"/>
  <path d="M110 275l130-45 55 15-20 85H80z" fill="#fff"/>
  <path d="M60 275l60-8 5 63H55z" fill="#0f5a36"/>
  <path d="M60 275l190-45 45 15-10 85H100z" fill="#12713f"/>
  <text x="185" y="305" font-family="Georgia,serif" font-weight="700" font-size="30" fill="#c9d98a">USB</text>
  <path d="M230 232l55-35" stroke="#0f5a36" stroke-width="8" stroke-linecap="round"/>
  <circle cx="45" cy="318" r="22" fill="#f6c93a"/>
  <circle cx="265" cy="290" r="20" fill="#f6c93a"/>
</svg>

</body>
</html>
